<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="absolute w-full h-full bg-[url(./img/bg-2.jpeg)] bg-no-repeat bg-cover"
    >
      <header
        class="w-full bg-yellow-600/35 flex items-center p-2 justify-between px-20 shadow-md h-16 backdrop-blur-md"
      >
        <div class="flex items-center gap-2">
          <img src="img/icon_music.png" class="w-12" alt="" />
          <span class="max-md:hidden font-bold text-xl">Music Player</span>
        </div>
        <input
          type="text"
          class="inpSearch pl-5 h-8 rounded-md"
          placeholder="Search for song"
        />
      </header>
      <main
        class="flex max-md:flex-col max-md:overflow-y-scroll w-full h-[80%] p-10 gap-16"
      >
        <div
          class="relative max-xl:p-2 max-lg:p-6 max-md:w-full shadow-sm shadow-gray-700 bg-white/35 backdrop-blur-md flex flex-col justify-center items-center w-[40%] rounded-3xl gap-1"
        >
          <div
            class="bg-yellow-600/80 w-72 h-72 max-xl:w-52 max-xl:h-52 max-lg:w-36 max-lg:h-36 max-md:w-52 max-md:h-52 rounded-full overflow-hidden"
          >
            <img class="imgMainSong" src="img/oliverImg.jpeg" />
          </div>
          <div class="mt-2 flex flex-col gap-1 items-center">
            <span class="currentTime text-lg font-bold">00:00</span>
            <marquee
              direction="right"
              class="songTitle font-semibold"
            ></marquee>
            <div>
              <input
                type="range"
                name=""
                class="inpRange w-80 max-xl:w-40 bg-red-200"
                id=""
              />
            </div>
          </div>
          <div class="flex gap-6 mt-6">
            <div class="bg-yellow-600/30 rounded-full overflow-hidden">
              <img class="w-11 prevBtn" src="/img/prev.png" />
            </div>
            <div class="bg-yellow-600/30 rounded-full overflow-hidden">
              <img class="w-11 pauseBtn" src="/img/play-music.png" />
            </div>
            <div class="bg-yellow-600/30 rounded-full overflow-hidden">
              <img class="w-11 nextBtn" src="/img/next.png" />
            </div>
          </div>

          <div
            class="favIcon rounded-full p-2 border border-black absolute right-2 top-3 w-12"
          >
            <img class="favIconImg" src="img/favoris.png" />
          </div>
        </div>
        <div
          class="flex gap-2 p-8 flex-col shadow-sm bg-white/35 shadow-gray-700 backdrop-blur-md rounded-lg w-full"
        >
          <div class="flex p-2 gap-4">
            <button
              class="morcBtn font-semibold hover:text-white hover:bg-yellow-600 bg-white/50 p-1 w-22 rounded-lg border border-black"
            >
              Morceaux
            </button>
            <button
              class="favBtn font-semibold hover:text-white hover:bg-yellow-600 bg-white/50 p-1 w-22 rounded-lg border border-black"
            >
              Favoris
            </button>
          </div>
          <ul
            class="list-songs w-full flex flex-col gap-2 p-1 overflow-y-auto"
          ></ul>
        </div>
      </main>
      <footer
        class="absolute bg-yellow-600/35 bottom-0 border-t shadow-md w-full flex items-center justify-center gap-6 h-20 backdrop-blur-md"
      >
        <audio class="audio" src="oliver.mp3"></audio>
        <img class="w-8 muteVolume" src="img/volume.png" />
        <input type="range" class="audioRange w-32" />
      </footer>
    </div>
    <script src="index.js"></script>
  </body>
</html>
